name: nitu5-local
# Nitu5 local-first stack — $0, no subscriptions.
# Infra now: db + redis + s3 + mailpit.
# api/worker/admin/mobile are uncommented once their Dockerfiles exist (Phase A).

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nitu5-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nitu5}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nitu5}
      POSTGRES_DB: ${POSTGRES_DB:-nitu5}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nitu5}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nitu5-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  s3:
    # Free S3-compatible mock (MinIO images now need paid login).
    # Same S3 API — swap S3_ENDPOINT to R2 when going public.
    image: adobe/s3mock:latest
    container_name: nitu5-s3
    restart: unless-stopped
    ports:
      - "${S3_PORT:-9090}:9090"   # S3_ENDPOINT=http://localhost:9090
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9090/"]
      interval: 15s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: nitu5-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP_HOST=localhost:1025
      - "${MAILPIT_UI_PORT:-8025}:8025"   # inbox UI
    volumes:
      - mailpitdata:/data

  # ---- Uncomment in Phase A (needs Dockerfiles) ----
  # api:
  #   build: ./apps/api
  #   container_name: nitu5-api
  #   depends_on:
  #     db: { condition: service_healthy }
  #     redis: { condition: service_healthy }
  #   env_file: .env
  #   ports: ["${API_PORT:-3000}:3000"]
  # worker:
  #   build: ./services/worker
  #   container_name: nitu5-worker
  #   depends_on:
  #     db: { condition: service_healthy }
  #     redis: { condition: service_healthy }
  #   env_file: .env

volumes:
  pgdata:
  redisdata:
  mailpitdata:
